# Fly.io configuration for cartx
# Update `app` to your chosen Fly app name before first deploy.
# Or run `fly launch --copy-config` to let Fly generate this interactively.

app = "cartx"
primary_region = "bom"  # Mumbai — close to India merchants

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # keep warm to avoid Shopify embed load delays
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Liveness/readiness check. Fly marks a machine unhealthy (and restarts it) if
  # /health stops returning 200 — catches a hung process or lost DB connection
  # that still holds the port open. grace_period covers boot + migrations.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# No [deploy] release_command on purpose.
# Migrations run on every app machine at boot via `npm run docker-start`
# (-> `npm run setup` -> `prisma migrate deploy`), so a separate ephemeral
# release machine is redundant. Removing it also lets deploys succeed when
# the bom region has no spare capacity to launch a new release VM — existing
# machines are updated in place instead.

# ─ Scheduled jobs (analytics) ──────────────────────────────────────────
# Fly schedules are configured via `fly machine run`, not via fly.toml.
# Provision these once per environment, pointing at the CURRENT deployed image
# (get it from `fly status` -> Image, prefixed with registry.fly.io/).
#
# Notes learned the hard way:
#  - Pass the command as plain positional args (`npm run rollup`). Do NOT use
#    `sh -c "..."` — the `-c` collides with flyctl's own `-c/--config` flag and
#    the command silently becomes a no-op `sh`.
#  - The Prisma client is baked into the image (Dockerfile `npx prisma generate`),
#    so the job script runs without a separate generate step.
#  - bom frequently has no spare capacity; these batch jobs aren't latency
#    sensitive, so we run them in sin (Singapore).
#
#   IMAGE="registry.fly.io/cartx:deployment-XXXXXXXX"
#
#   fly machine run "$IMAGE" --app cartx --schedule hourly \
#     --name analytics-rollup --region sin -e NODE_ENV=production \
#     npm run rollup
#
#   fly machine run "$IMAGE" --app cartx --schedule daily \
#     --name analytics-retention --region sin -e NODE_ENV=production \
#     npm run retention
#
# These boot, run, and shut down. Failures alert via Sentry cron heartbeats
# (monitors: cartx-rollup, cartx-retention) and are visible via `fly logs`.
