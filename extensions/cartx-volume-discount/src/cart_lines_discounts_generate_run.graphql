query CartInput {
  cart {
    cartxActive: attribute(key: "_cartx") {
      value
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
        }
      }
      freebieAttr: attribute(key: "_freebie") {
        value
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:cartx-volume-discount", key: "function-configuration") {
      value
    }
  }
}
