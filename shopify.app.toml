# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# ⚠️  HEADS UP: `automatically_update_urls_on_dev = true` (see [build] below)
# means `shopify app dev` will overwrite `application_url` + `redirect_urls`
# below with the tunnel URL of your local session. Before submitting for
# App Store review, run `shopify app deploy` to push the production
# (cartx.fly.dev) URLs back to Shopify Partners.

client_id = "3021118f1f808e0497865a902802d352"
name = "cartx"
application_url = "https://cartx.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data-request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_themes,read_products,write_products,read_discounts,write_discounts,read_customers,read_content,read_orders"

# App-owned shop metafield holding the drawer styling, exposed to the storefront
# so the theme app extension (app-embed.liquid) can inline it and the drawer can
# apply styling on first paint (no proxy round-trip → no default→custom flash).
# Value is written by app/lib/drawer-metafield.server.js; this declares the schema
# + storefront read access. Read in Liquid as shop.metafields['$app'].drawer_config.
[shop.metafields.app.drawer_config]
name = "cartx drawer config"
description = "Storefront drawer styling (managed by cartx)."
type = "json"
access.storefront = "public_read"

[auth]
redirect_urls = [ "https://cartx.fly.dev/auth/callback" ]

[app_proxy]
url = "https://cartx.fly.dev/proxy"
subpath = "cartmax"
prefix = "apps"
