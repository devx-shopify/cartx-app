# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3021118f1f808e0497865a902802d352"
name = "cartx"
application_url = "https://cartx.fly.dev"
embedded = true

[build]
# When true, `shopify app dev` overwrites the URLs below with the ngrok
# tunnel on every dev session. You MUST reset URLs to https://cartx.fly.dev
# before running `npm run deploy` (Shopify CLI). The GitHub Actions Fly
# deploy ignores this file, so committing dev URLs won't break Fly itself
# — only Partner Dashboard routing.
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data-request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_themes,read_products,write_products,read_discounts,write_discounts,read_customers,read_content"

[auth]
redirect_urls = [ "https://cartx.fly.dev/auth/callback" ]

[app_proxy]
url = "https://cartx.fly.dev/proxy"
subpath = "cartmax"
prefix = "apps"
