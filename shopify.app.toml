# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3021118f1f808e0497865a902802d352"
name = "cartx"
application_url = "https://merrilee-nonanarchic-dextrosinistrally.ngrok-free.dev:3000"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_themes,read_products,write_products,read_discounts,write_discounts,read_customers"

[auth]
redirect_urls = [ "https://merrilee-nonanarchic-dextrosinistrally.ngrok-free.dev:3000/auth/callback" ]

[app_proxy]
url = "https://merrilee-nonanarchic-dextrosinistrally.ngrok-free.dev:3000/proxy"
subpath = "cartmax"
prefix = "apps"
