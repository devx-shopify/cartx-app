name: Fly Deploy

on:
  push:
    branches:
      - main
    # Only deploy Fly when SERVER code actually changes. The drawer + extensions
    # are served by Shopify's CDN (via `shopify app deploy`), NOT by Fly — the
    # Dockerfile only runs `react-router build`, it doesn't bundle the drawer.
    # So extension/drawer-only pushes must not trigger a wasted Fly rebuild.
    # Allowlist of Fly-relevant paths; app/drawer-src/** is under app/ but builds
    # into the extension, so it's explicitly excluded.
    paths:
      - 'app/**'
      - '!app/drawer-src/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'fly.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'react-router.config.*'
      - '.github/workflows/fly-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --app cartx
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
